# Local end-to-end demo: the scheduler plus one fake host agent, so gridctl
# can be run against a live grid. See "Demo with docker compose" in README.md.
#
# No tokens are stored here. Export them before `docker compose up`:
#   export FAKE_HOST_TOKEN=$(openssl rand -hex 32)
#   export GRID_USER_TOKEN=$(openssl rand -hex 32)
services:
  scheduler:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "index.js"]
    volumes:
      - ./scheduler:/app:ro
    environment:
      PORT: "3000"
      HOST_TTL_SECONDS: "120"
      HOST_TOKENS: '{"fake-host-1": "${FAKE_HOST_TOKEN:?export FAKE_HOST_TOKEN first}"}'
      USER_TOKENS: '{"demo-user": "${GRID_USER_TOKEN:?export GRID_USER_TOKEN first}"}'
    ports:
      # Published on the loopback interface only.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  fake-host:
    image: node:22-alpine
    command: ["node", "/agent/fake_host_agent.js"]
    volumes:
      - ./scripts/fake_host_agent.js:/agent/fake_host_agent.js:ro
    environment:
      SCHEDULER_URL: http://scheduler:3000
      HOST_ID: fake-host-1
      HOST_TOKEN: ${FAKE_HOST_TOKEN:?export FAKE_HOST_TOKEN first}
      REPORT_INTERVAL_SECONDS: "30"
      GPU_MODEL: A100
      VRAM_MB: "40960"
      FREE_MEMORY_MB: "30000"
      GPU_UTIL_PCT: "5"
    depends_on:
      scheduler:
        condition: service_healthy
