<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GPU Grid Console</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
      th { background: #f6f6f6; }
      .small { font-size: 0.9em; color: #666; }
    </style>
  </head>
  <body>
    <h1>GPU Grid - Hosts</h1>
    <div id="last">Updating...</div>
    <table id="hosts"><thead><tr><th>id</th><th>model</th><th>vram_mb</th><th>gpu_util_pct</th><th>free_memory_mb</th><th>timestamp</th></tr></thead><tbody></tbody></table>
    <script>
      async function refresh() {
        try {
          const res = await fetch('/hosts');
          if (!res.ok) throw new Error('failed to fetch hosts');
          const payload = await res.json();
          const tbody = document.querySelector('#hosts tbody');
          tbody.innerHTML = '';
          (payload.hosts || []).forEach(h => {
            const tr = document.createElement('tr');
            ['id','model','vram_mb','gpu_util_pct','free_memory_mb','timestamp'].forEach(k => {
              const td = document.createElement('td');
              td.textContent = h[k] === undefined ? '' : h[k];
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          document.getElementById('last').textContent = 'Last update: ' + new Date().toLocaleTimeString();
        } catch (err) {
          document.getElementById('last').textContent = 'Error fetching hosts: ' + err.message;
        }
      }
      // initial load and poll every second
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
